name: Build

on:
  workflow_dispatch:

env:
  PLUGIN_VERSION: 1.7.0-omp

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}

      - name: Configure
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build -S .

      - name: Build
        run: cmake --build build

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/pawnraknet.dll package/
          Copy-Item src/Pawn.RakNet.inc package/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pawnraknet-${{ env.PLUGIN_VERSION }}-win-${{ matrix.arch }}
          path: package/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install common packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Install multilib (x86 only)
        if: matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib libstdc++-14-dev:i386

      - name: Configure (x86)
        if: matrix.arch == 'x86'
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -B build -S .

      - name: Configure (x64)
        if: matrix.arch == 'x64'
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build -S .

      - name: Build
        run: cmake --build build

      - name: Package
        run: >
          tar -czf pawnraknet-${{ env.PLUGIN_VERSION }}-linux-${{ matrix.arch }}.tar.gz
          -C build pawnraknet.so -C ../src Pawn.RakNet.inc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pawnraknet-${{ env.PLUGIN_VERSION }}-linux-${{ matrix.arch }}
          path: pawnraknet-${{ env.PLUGIN_VERSION }}-linux-${{ matrix.arch }}.tar.gz
